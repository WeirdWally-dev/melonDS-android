name: melonDS Android Release

on:
  # Trigger action when a tag is pushed
  push:
    tags:
      - '*'
      - '!nightly-release'

# Needed to create the GitHub release and attach the APK
permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: zulu

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build melonDS Android
        env:
          MELONDS_KEYSTORE: ${{ secrets.MELONDS_KEYSTORE }}
          MELONDS_KEYSTORE_PASSWORD: ${{ secrets.MELONDS_KEYSTORE_PASSWORD }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if [ -n "$MELONDS_KEYSTORE" ]; then
            echo "$MELONDS_KEYSTORE" | base64 -d > ${{runner.workspace}}/keystore.jks
          else
            # No signing key in this fork's secrets: sign with a throwaway key so the APK is still installable.
            # Add MELONDS_KEYSTORE (base64 .jks, alias "melonds") and MELONDS_KEYSTORE_PASSWORD for stable signing.
            echo "::warning::MELONDS_KEYSTORE secret not set, signing with a temporary key"
            MELONDS_KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore ${{runner.workspace}}/keystore.jks -alias melonds -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$MELONDS_KEYSTORE_PASSWORD" -keypass "$MELONDS_KEYSTORE_PASSWORD" -dname "CN=melonDS LAN fork"
          fi
          echo "MELONDS_KEYSTORE=${{runner.workspace}}/keystore.jks" >> local.properties
          echo "MELONDS_KEYSTORE_PASSWORD=$MELONDS_KEYSTORE_PASSWORD" >> local.properties
          echo "MELONDS_KEY_ALIAS=melonds" >> local.properties
          echo "MELONDS_KEY_PASSWORD=$MELONDS_KEYSTORE_PASSWORD" >> local.properties
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdRelease :lobby:assembleRelease
          cp lobby/build/outputs/apk/release/lobby-release.apk DS-Lobby.apk

      - name: Get Tag and Version
        id: release_params
        run: |
          echo TAG=${GITHUB_REF/refs\/tags\//} >> $GITHUB_OUTPUT
          echo VERSION=$(grep -oP 'versionName = "\K(.*?)(?=")' buildSrc/src/main/kotlin/AppConfig.kt) >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          tag: ${{ steps.release_params.outputs.TAG }}
          name: ${{ steps.release_params.outputs.VERSION }}
          bodyFile: ./.github/changelog/gitHub.md
          artifacts: app/build/outputs/apk/gitHubProd/release/app-gitHub-prod-release.apk,DS-Lobby.apk
          artifactContentType: application/vnd.android.package-archive

      - name: Upload APK, Mapping and Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: github-release
          path: |
            app/build/outputs/apk/gitHubProd/release/app-gitHub-prod-release.apk
            DS-Lobby.apk
            app/build/outputs/mapping/gitHubProdRelease/mapping.txt
            app/build/outputs/native-debug-symbols/gitHubProdRelease/native-debug-symbols.zip
